 in mei en juni, trekt vlinders en bijen, en vormt een compacte, goed vertakte struik.",sizes:[{label:"40–60 cm",price:"27,00"},{label:"60–80 cm",price:"42,00"},{label:"80–100 cm",price:"60,00"},{label:"100–120 cm",price:"82,00"}]},{slug:"catawbiense-grandiflorum",name:"Catawbiense Grandiflorum",color:"Lila-roze",hex:"#b98fcf",bloei:"Mei – juni",standplaats:"Halfschaduw, verdraagt zon",hoogte:"tot 3 m",breedte:"tot 3 m",groei:"Matig – snel",from:"29",short:"Lila-roze bloemen op indrukwekkend formaat, de beste keuze voor grote tuinen.",long:"De Catawbiense Grandiflorum is de kolos van ons assortiment: groot, krachtig en indrukwekkend. Met zijn lila-roze bloemtrossen en snelle groei is dit de ideale soort voor haagvorming, privacyschermen of grootschalige beplanting. Uitstekend winterhard en vrijwel onderhoudsloos. Populair bij hoveniers en tuineigenaren met ruimte voor iets groots.",sizes:[{label:"40–60 cm",price:"29,00"},{label:"60–80 cm",price:"45,00"},{label:"80–100 cm",price:"65,00"},{label:"100–120 cm",price:"89,00"}]},{slug:"ponticum-roseum",name:"Ponticum Roseum",color:"Roze / lichtpaars",hex:"#e3a2c3",bloei:"Mei – juni",standplaats:"Halfschaduw / schaduw",hoogte:"tot 4 m",breedte:"tot 3,5 m",groei:"Snel",from:"22",short:"Roze-lichtpaarse bloemen, robuust en snel groeiend met decoratieve rode stelen.",long:"Ponticum Roseum combineert de groeikracht van de Ponticum met zachte roze-lichtpaarse bloemen en decoratieve rode jonge stelen. Deze robuuste soort groeit snel tot indrukwekkende hoogte en is uitstekend geschikt als haag of privacyscherm. Weinig onderhoud, uitstekend winterhard, en het hele jaar door sierwaarde.",sizes:[{label:"40–60 cm",price:"22,00"},{label:"60–80 cm",price:"35,00"},{label:"80–100 cm",price:"50,00"},{label:"100–120 cm",price:"70,00"}]},{slug:"ponticum",name:"Ponticum",color:"Violet-paars",hex:"#7b5ea7",bloei:"Mei – juni",standplaats:"Halfschaduw / schaduw",hoogte:"tot 4 m",breedte:"tot 4 m",groei:"Snel",from:"22",short:"Violet-paarse bloemen op een robuuste, snel groeiende struik voor grote tuinen.",long:"Rhododendron Ponticum is de krachtigste soort uit ons assortiment. Met zijn violet-paarse bloemen en indrukwekkende groeikracht is deze plant ideaal voor grote tuinen, bosranden en privacyschermen. De plant kan tot 4 meter hoog worden en vergt weinig onderhoud. Uitstekend winterhard en geschikt voor zowel halfschaduw als schaduwrijke plekken.",sizes:[{label:"40–60 cm",price:"22,00"},{label:"60–80 cm",price:"35,00"},{label:"80–100 cm",price:"50,00"},{label:"100–120 cm",price:"70,00"}]}],Zu={name:"Tuinturf-substraat",price:"14,95",unit:"per 40 L zak"},D={name:"Top Rhododendrons",founder:"Gert Top",street:"Esserbroekweg 2",postal:"6731 DB Otterlo",region:"Veluwe, Gelderland",kvk:"82480273",email:"info@toprhododendrons.nl",phone1:"06 20 10 43 12",phone1Href:"tel:+31620104312",phone2:"06 20 29 78 49",phone2Href:"tel:+31620297849",whatsapp:"https://wa.me/31620297849",instagram:"https://www.instagram.com/toprhododendrons",maps:"https://www.google.com/maps/search/Esserbroekweg+2+Otterlo",voorwaarden:"https://toprhododendrons.nl/voorwaarden",privacy:"https://toprhododendrons.nl/privacy",pickup:"Afhalen in Otterlo mogelijk: wij zetten uw bestelling klaar.",hours:[["Maandag – vrijdag","08:00 – 17:00"],["Zaterdag","09:00 – 13:00"],["Zondag","Gesloten"]]},V2=[{title:"Aangroeigarantie op elke plant",text:"Niet aangeslagen in het eerste seizoen? Wij vervangen kosteloos."},{title:"Vers gerooid, flexibel geleverd",text:"Uw planten staan niet onnodig te wachten. We rooien ze vers voor uw geplande bezorging of het moment dat u ze komt afhalen."},{title:"Eigen transport door heel Nederland",text:"Wij stemmen de levering af op uw planning, of zetten uw bestelling klaar voor afhaal in Otterlo."},{title:"Persoonlijk advies van de kweker",text:"U spreekt rechtstreeks met de kweker. Eén aanspreekpunt, van vraag tot levering."}],hr={h:"Wij kweken rhododendrons. Niet meer, niet minder.",p1:"Familiebedrijf in Otterlo, op de Veluwe. 10.000 planten op voorraad, direct van het veld naar uw tuin.",p2:"Dankzij onze veenrijke bodem en een uitgebalanceerde watergift ontwikkelen onze planten een sterk wortelstelsel. Daardoor passen ze zich moeiteloos aan in uw tuin, met aangroeigarantie.",p3:"Uw planten staan niet onnodig te wachten: we rooien ze vers voor uw geplande bezorging, of voor het moment dat u ze komt afhalen. Zo komt elke plant in optimale conditie aan.",quote:"Een gezonde plant is geen toeval. Dat is onze standaard."},O2=[{k:"Otterlo, Veluwe",v:"Veenrijke bodem"},{k:"Sinds 2001",v:"Familiebedrijf"},{k:"10.000 planten",v:"Op ons veld, 40 – 120+ cm"},{k:"Aangroeigarantie",v:"Op elke plant"}],F2=[{q:"Hoe en wanneer wordt mijn rhododendron geleverd?",a:"Wij leveren met eigen transport door heel Nederland. Na uw bestelling nemen wij contact met u op om een leveringsmoment af te stemmen dat voor u uitkomt. Uw plant wordt vers gerooid en direct geleverd, zo komt hij in optimale conditie aan."},{q:"Wanneer kan ik een rhododendron aanplanten?",a:"Een rhododendron kunt u het hele jaar door aanplanten, behalve tijdens vorstperiodes. De ideale momenten zijn vroege lente (maart–april) en herfst (september–oktober). Plant u in de zomer, zorg dan voor voldoende water in de eerste weken na het planten."},{q:"Welke grond heeft een rhododendron nodig?",a:"De rhododendron gedijt het beste op zure, luchtige grond: denk aan zandgrond of veengrond met een pH tussen 4,5 en 6. Op zware kleigrond groeit de plant minder goed. Voeg bij het aanplanten rododendrongrond toe voor de beste start. Twijfelt u? Wij geven graag advies op maat."},{q:"Wat houdt de aangroeigarantie in?",a:"Al onze planten worden geleverd met aangroeigarantie. Slaat een plant niet aan in het eerste seizoen, ondanks de juiste verzorging? Neem dan contact met ons op: wij vervangen kosteloos. Onze reputatie is gebouwd op kwaliteit, en die nemen wij serieus."},{q:"Kan ik ook één plant bestellen?",a:"Ja. Voor particulieren geldt geen minimumbe
