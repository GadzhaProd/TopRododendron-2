od"],hoogte:"tot 3 m",hoogteNum:3,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig",groeiCm:"15–20 cm per jaar",groeiMax:20,zone:5,geschiktVoor:["Tuin","Haag"],from:"29",short:"Opvallende helderrode bloemen, de meest populaire rhododendron van Nederland.",long:"Nova Zembla is de bestverkopende rhododendron van Nederland, en niet zonder reden. De vuurrode bloemtrossen zijn imposant en rijkelijk, en de plant bloeit betrouwbaar elk jaar in mei en juni. Uitstekend winterhard, geschikt als solitair of haag, en zontoleranter dan de meeste soorten. Direct van eigen kwekerij in Otterlo, vers gerooid bij uw bestelling.",sizes:bg},{slug:"cunninghams-white",name:"Cunningham's White",color:"Wit / lichtroze",hex:"#f1ece3",light:!0,bloei:"April – mei",bloomMonths:[4,5],bloeiStart:4,standplaats:"Halfschaduw",standplaatsFilter:["Halfschaduw"],kleurFilter:["Wit"],hoogte:"tot 2 m",hoogteNum:2,hoogteFilter:"1–2 m",breedte:"tot 2 m",breedteNum:2,groei:"Langzaam",groeiCm:"8–12 cm per jaar",groeiMax:12,zone:4,geschiktVoor:["Tuin","Haag"],from:"25",short:"Elegante witte bloemen met subtiele roze accenten, vroegste bloei van alle soorten.",long:"Cunningham's White is een klassieke rhododendron die als eerste van alle soorten bloeit: al in april kleuren de witte bloemen met subtiele lichtroze tinten uw tuin. De plant groeit gestaag en vormt een mooie volle struik, ideaal als solitair of als haag. Tijdloze schoonheid, uitstekende winterhardheid, weinig onderhoud. Rechtstreeks van eigen kwekerij voor de allerbeste plantkwaliteit.",sizes:[{label:"40–60 cm",price:"25,00"},{label:"60–80 cm",price:"39,00"},{label:"80–100 cm",price:"55,00"},{label:"100–120 cm",price:"75,00"}]},{slug:"roseum-elegans",name:"Roseum Elegans",color:"Warm roze / lavendel-roze",hex:"#d9679a",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon en hitte",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Roze"],hoogte:"tot 2,5 m",hoogteNum:2.5,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig – snel",groeiCm:"20–25 cm per jaar",groeiMax:25,zone:5,geschiktVoor:["Tuin","Haag"],from:"27",short:"Klassieke warm roze bloemen, hitte- en koudewinterhard, uitstekend als haag.",long:"Roseum Elegans is een tijdloze klassieker met warme roze bloemtrossen die imposant en rijkelijk bloeien in mei en juni. De plant groeit krachtig en breed, is uitstekend winterhard én hittebestendig: zelfs in zomerse periodes blijft hij gezond. Ideaal als solitair of als haag in grotere tuinen. Een betrouwbare keuze die jaar na jaar verrast.",sizes:_g},{slug:"catawbiense-boursault",name:"Catawbiense Boursault",color:"Paars-lavendel",hex:"#9a6cc4",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars"],hoogte:"tot 2,5 m",hoogteNum:2.5,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig",groeiCm:"15–20 cm per jaar",groeiMax:20,zone:5,geschiktVoor:["Tuin","Haag"],from:"27",short:"Prachtige paars-lavendel bloemen, ijzersterk en betrouwbaar.",long:"De Catawbiense Boursault is een van de meest betrouwbare rhododendrons voor de Nederlandse tuin. Met zijn opvallende paars-lavendel bloemen en uitstekende winterhardheid is deze soort ideaal voor vrijwel elke situatie. De plant bloeit rijkelijk in mei en juni, trekt vlinders en bijen, en vormt een compacte, goed vertakte struik. Direct van eigen kwekerij, geen tussenhandel.",sizes:_g},{slug:"catawbiense-grandiflorum",name:"Catawbiense Grandiflorum",color:"Lila-roze / lavendel",hex:"#b98fcf",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars","Roze"],hoogte:"tot 3 m",hoogteNum:3,hoogteFilter:"2–3 m",breedte:"tot 3 m",breedteNum:3,groei:"Matig – snel",groeiCm:"20–25 cm per jaar",groeiMax:25,zone:5,geschiktVoor:["Tuin","Haag"],from:"29",short:"Li
