te:"tot 2 m",hoogteNum:2,hoogteFilter:"1–2 m",breedte:"tot 2 m",breedteNum:2,groei:"Langzaam",groeiCm:"8–12 cm per jaar",groeiMax:12,zone:4,geschiktVoor:["Tuin","Haag"],from:"25",short:"Elegante witte bloemen met subtiele roze accenten, vroegste bloei van alle soorten.",long:"Cunningham's White is een klassieke rhododendron die als eerste van alle soorten bloeit: al in april kleuren de witte bloemen met subtiele lichtroze tinten uw tuin. De plant groeit gestaag en vormt een mooie volle struik, ideaal als solitair of als haag. Tijdloze schoonheid, uitstekende winterhardheid, weinig onderhoud. Rechtstreeks van eigen kwekerij voor de allerbeste plantkwaliteit.",sizes:[{label:"40–60 cm",price:"25,00"},{label:"60–80 cm",price:"39,00"},{label:"80–100 cm",price:"55,00"},{label:"100–120 cm",price:"75,00"}]},{slug:"roseum-elegans",name:"Roseum Elegans",color:"Warm roze / lavendel-roze",hex:"#d9679a",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon en hitte",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Roze"],hoogte:"tot 2,5 m",hoogteNum:2.5,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig – snel",groeiCm:"20–25 cm per jaar",groeiMax:25,zone:5,geschiktVoor:["Tuin","Haag"],from:"27",short:"Klassieke warm roze bloemen, hitte- en koudewinterhard, uitstekend als haag.",long:"Roseum Elegans is een tijdloze klassieker met warme roze bloemtrossen die imposant en rijkelijk bloeien in mei en juni. De plant groeit krachtig en breed, is uitstekend winterhard én hittebestendig: zelfs in zomerse periodes blijft hij gezond. Ideaal als solitair of als haag in grotere tuinen. Een betrouwbare keuze die jaar na jaar verrast.",sizes:bg},{slug:"catawbiense-boursault",name:"Catawbiense Boursault",color:"Paars-lavendel",hex:"#9a6cc4",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars"],hoogte:"tot 2,5
