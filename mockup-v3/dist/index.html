loeien in mei en juni. De plant groeit krachtig en breed, is uitstekend winterhard én hittebestendig: zelfs in zomerse periodes blijft hij gezond. Ideaal als solitair of als haag in grotere tuinen. Een betrouwbare keuze die jaar na jaar verrast.",sizes:Fg},{slug:"catawbiense-boursault",name:"Catawbiense Boursault",color:"Paars-lavendel",hex:"#9a6cc4",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars"],hoogte:"tot 2,5 m",hoogteNum:2.5,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig",groeiCm:"15–20 cm per jaar",groeiMax:20,zone:5,geschiktVoor:["Tuin","Haag"],from:"27",short:"Prachtige paars-lavendel bloemen, ijzersterk en betrouwbaar.",long:"De Catawbiense Boursault is een van de meest betrouwbare rhododendrons voor de Nederlandse tuin. Met zijn opvallende paars-lavendel bloemen en uitstekende winterhardheid is deze soort ideaal voor vrijwel elke situatie. De plant bloeit rijkelijk in mei en juni, trekt vlinders en bijen, en vormt een compacte, goed vertakte struik. Direct van eigen kwekerij, geen tussenhandel.",sizes:Fg},{slug:"catawbiense-grandiflorum",name:"Catawbiense Grandiflorum",color:"Lila-roze / lavendel",hex:"#b98fcf",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars","Roze"],hoogte:"tot 3 m",hoogteNum:3,hoogteFilter:"2–3 m",breedte:"tot 3 m",breedteNum:3,groei:"Matig – snel",groeiCm:"20–25 cm per jaar",groeiMax:25,zone:5,geschiktVoor:["Tuin","Haag"],from:"29",short:"Lila-roze bloemen op indrukwekkend formaat, de beste keuze voor grote tuinen.",long:"De Catawbiense Grandiflorum is de kolos van ons assortiment: groot, krachtig en indrukwekkend. Met zijn lila-roze bloemtrossen en snelle groei is dit de ideale soort voor haagvorming, privacyschermen of grootschalige beplanting. Uitstekend winterhard en vrijwel on el Nederland. Na uw bestelling nemen wij contact met u op om een leveringsmoment af te stemmen dat voor u uitkomt. Uw plant wordt vers gerooid en direct geleverd, zo komt hij in optimale conditie aan."},{q:"Wanneer kan ik een rhododendron aanplanten?",a:"Een rhododendron kunt u het hele jaar door aanplanten, behalve tijdens vorstperiodes. De ideale momenten zijn vroege lente (maart–april) en herfst (september–oktober). Plant u in de zomer, zorg dan voor voldoende water in de eerste weken na het planten."},{q:"Welke grond heeft een rhododendron nodig?",a:"De rhododendron gedijt het beste op zure, luchtige grond: denk aan zandgrond of veengrond met een pH tussen 4,5 en 6. Op zware kleigrond groeit de plant minder goed. Voeg bij het aanplanten rododendrongrond toe voor de beste start. Twijfelt u? Wij geven graag advies op maat."},{q:"Wat houdt de aangroeigarantie in?",a:"Al onze planten worden geleverd met aangroeigarantie. Groeit een plant niet aan ondanks de juiste verzorging? Neem dan contact met ons op, wij zoeken samen naar een passende oplossing. Onze reputatie is gebouwd op kwaliteit, en die nemen wij serieus."},{q:"Kan ik ook één plant bestellen?",a:"Ja. Voor particulieren geldt geen minimumbestelling; u kunt gewoon één plant bestellen. Heeft u een kleinere opdracht als hovenier? Neem contact op, we denken graag mee."},{q:"Moet ik mijn rhododendron snoeien?",a:"Snoeien is niet noodzakelijk, maar kan wel. Snoei bij voorkeur direct na de bloei, van eind april tot halverwege juni. Zo heeft de plant de rest van het seizoen tijd om nieuwe bloemknoppen te vormen voor volgend jaar. Radicaal snoeien raden wij af: dit vertraagt de bloei met twee tot drie jaar."}],ec=e=>"€ "+e.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,"."),jS=e=>parseFloat(e.replace(".","").replace(",","."));function CS({className:e}){return c.jsx("svg",{viewBox:"0 0 24 24",className:e,fill:"currentColor","aria-hidden":"true",children:c.jsx("path",{d:"M12.04 2C6.58 2 2.13 6.45 2.13 11.9
