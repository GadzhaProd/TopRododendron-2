-boursault",name:"Catawbiense Boursault",color:"Paars-lavendel",hex:"#9a6cc4",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars"],hoogte:"tot 2,5 m",hoogteNum:2.5,hoogteFilter:"2–3 m",breedte:"tot 2,5 m",breedteNum:2.5,groei:"Matig",groeiCm:"15–20 cm per jaar",groeiMax:20,zone:5,geschiktVoor:["Tuin","Haag"],from:"27",short:"Prachtige paars-lavendel bloemen, ijzersterk en betrouwbaar.",long:"De Catawbiense Boursault is een van de meest betrouwbare rhododendrons voor de Nederlandse tuin. Met zijn opvallende paars-lavendel bloemen en uitstekende winterhardheid is deze soort ideaal voor vrijwel elke situatie. De plant bloeit rijkelijk in mei en juni, trekt vlinders en bijen, en vormt een compacte, goed vertakte struik. Direct van eigen kwekerij, geen tussenhandel.",sizes:yg},{slug:"catawbiense-grandiflorum",name:"Catawbiense Grandiflorum",color:"Lila-roze / lavendel",hex:"#b98fcf",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw, verdraagt zon",standplaatsFilter:["Halfschaduw","Volle zon"],kleurFilter:["Paars","Roze"],hoogte:"tot 3 m",hoogteNum:3,hoogteFilter:"2–3 m",breedte:"tot 3 m",breedteNum:3,groei:"Matig – snel",groeiCm:"20–25 cm per jaar",groeiMax:25,zone:5,geschiktVoor:["Tuin","Haag"],from:"29",short:"Lila-roze bloemen op indrukwekkend formaat, de beste keuze voor grote tuinen.",long:"De Catawbiense Grandiflorum is de kolos van ons assortiment: groot, krachtig en indrukwekkend. Met zijn lila-roze bloemtrossen en snelle groei is dit de ideale soort voor haagvorming, privacyschermen of grootschalige beplanting. Uitstekend winterhard en vrijwel onderhoudsloos. Populair bij hoveniers en tuineigenaren met ruimte voor iets groots.",sizes:vg},{slug:"ponticum-roseum",name:"Ponticum Roseum",color:"Roze / lichtpaars",hex:"#e2a0c2",light:!1,bloei:"Mei – juni",bloomMonths:[5,6],bloeiStart:5,standplaats:"Halfschaduw / schaduw"
