e:"@toprhododendrons",maps:"https://www.google.com/maps/search/Esserbroekweg+2+Otterlo",voorwaarden:"https://toprhododendrons.nl/voorwaarden",privacy:"https://toprhododendrons.nl/privacy",hours:[["Maandag – vrijdag","08:00 – 17:00"],["Zaterdag","09:00 – 13:00"],["Zondag","Gesloten"]]},LS=[{q:"Hoe en wanneer wordt mijn rhododendron geleverd?",a:"Wij leveren met eigen transport door heel Nederland. Na uw bestelling nemen wij contact met u op om een leveringsmoment af te stemmen dat voor u uitkomt. Uw plant wordt vers gerooid en direct geleverd, zo komt hij in optimale conditie aan."},{q:"Wanneer kan ik een rhododendron aanplanten?",a:"Een rhododendron kunt u het hele jaar door aanplanten, behalve tijdens vorstperiodes. De ideale momenten zijn vroege lente (maart–april) en herfst (september–oktober). Plant u in de zomer, zorg dan voor voldoende water in de eerste weken na het planten."},{q:"Welke grond heeft een rhododendron nodig?",a:"De rhododendron gedijt het beste op zure, luchtige grond: denk aan zandgrond of veengrond met een pH tussen 4,5 en 6. Op zware kleigrond groeit de plant minder goed. Voeg bij het aanplanten rododendrongrond toe voor de beste start. Twijfelt u? Wij geven graag advies op maat."},{q:"Wat houdt de aangroeigarantie in?",a:"Al onze planten worden geleverd met aangroeigarantie. Groeit een plant niet aan ondanks de juiste verzorging? Neem dan contact met ons op, wij zoeken samen naar een passende oplossing. Onze reputatie is gebouwd op kwaliteit, en die nemen wij serieus."},{q:"Kan ik ook één plant bestellen?",a:"Ja. Voor particulieren geldt geen minimumbestelling; u kunt gewoon één plant bestellen. Heeft u een kleinere opdracht als hovenier? Neem contact op, we denken graag mee."},{q:"Moet ik mijn rhododendron snoeien?",a:"Snoeien is niet noodzakelijk, maar kan wel. Snoei bij voorkeur direct na de bloei, van eind april tot halverwege juni. Zo heeft de plant de rest van het seizoen tijd om nieuwe bloemknoppen te vormen voor volgend jaar. Radicaal snoeien raden wij af: dit vertraagt de bloei met twee tot drie jaar."}],FS=[{title:"Plant niet te diep",body:"Rhododendrons hebben oppervlakkige wortels. Plant de kluit 2–3 cm bóven het maaiveld, niet eronder. Te diep planten verstikt de wortels en doodt de plant binnen één tot twee seizoenen."},{title:"Vermijd de „mulch-vulkaan”",body:"Mulch tegen de stam ophopen lijkt logisch, maar het houdt de stam te vochtig en veroorzaakt rot. Laat altijd 5 cm rondom de stam vrij van mulch."},{title:"Bemest alleen als het écht nodig is",body:"Een gezonde rhododendron heeft géén bemesting nodig. Overbemesting verbrandt de wortels. Alleen bij gele bladeren bijvoeding gebruiken, en alléén ericaceous-meststof."},{title:"Vermijd ochtendzon in de winter",body:"Bevroren bladeren die plotseling in de ochtendzon ontdooien, barsten open. Plant uw rhododendron aan de noord- of westzijde, nooit aan de oostzijde van een muur of hek."},{title:"Gebruik regenwater, geen kraanwater",body:"Nederlands kraanwater is te kalkrijk voor rhododendrons. Een regenton bij de schuur is de goedkoopste investering die u in uw planten kunt doen."},{title:"Klei is dodelijk, zonder drainage",body:"Op kleigrond moet u een drainagebed van bladcompost aanleggen. Anders sterft 80% van de rhododendrons in het eerste jaar door wortelrot."},{title:"Verwijder uitgebloeide trossen met de hand",body:"Knip nooit met een schaar, u beschadigt de bloemknoppen voor volgend jaar die er al onder zitten. Breek de uitgebloeide tros voorzichtig af met uw vingers."}],OS=[{title:"Wanneer planten",text:"Het hele jaar door, behalve tijdens vorstperiodes. De ideale momenten zijn vroege lente (maart–april) en herfst (september–oktober). Plant u in de zomer, geef dan voldoende water in de eerste weken."},{title:"Welke grond",text:"Zure, luchtige grond: zandgrond of veengrond met een pH tussen 4,5 en 6. Op zware kleigrond groeit de plant minder goed. Voeg bij het planten rododendrongrond of ons tuinturf-substraat toe voor de beste start."},{title:"Snoeien",text:"Niet noodzakelijk, maar het kan. Snoei direct na de bloei, van eind april tot half juni, zodat de plant nieuwe bloemknoppen kan vormen. Radicaal snoeien vertraagt de bloei met twee tot drie jaar."}],Rg=e=>"€ "+e.toFixed(2).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g,".");function Dg({className:e}){return f.jsx("svg",{viewBox:"0 0 24 24",className:e,fill:"currentColor","aria-hidden":"true",children:f.jsx("path",{d:"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2m0 18.15c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 4.54 0 8.24 3.7 8.24 8.24.01 4.54-3.69 8.24-8.23 8.24m4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43s.17-.25.25-.41c.08-.17.04-.31-.02-.43s-.56-1.34-.76-1.84c-.2-.48-.41-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18s-.22-.16-.47-.28"})})}function IS(e=24){const[t,n]=C.useState(!1);return C.useEffect(()=>{const r=()=>n(window.scrollY>e);return r(),window.addEventListener("scroll",r,{passive:!0}),()=>window.removeEventListener("scroll",r)},[e]),t}function BS({home:e,onClick:t}){const n=PS();return n>0||!e?f.jsx(Fe,{as:"button",variant:"solid",size:"sm",onClick:()=>{t==null||t(),bS()},children:n>0?`Winkelwagen (${n})`:"Winkelwagen"}):f.jsx(Fe,{href:"#planten",variant:"solid",size:"sm",onClick:t,children:"Bestellen"})}function US({variant:e="retail",page:t}){const[n,r]=C.useState(!1),i=IS(24),s=C.useRef(null),[o,l]=C.useState(64),a=e==="b2b",u=t==="home";C.useEffect(()=>{var y;return lo(n),n&&l(((y=s.current)==null?void 0:y.getBoundingClientRect().bottom)??64),()=>l
